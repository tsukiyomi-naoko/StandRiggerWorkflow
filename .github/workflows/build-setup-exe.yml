name: Build StandRig Setup (Windows exe)

on:
  workflow_dispatch:
  push:
    tags: ["setup-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build one-file exe
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm --onefile --windowed --name StandRigSetup --add-data "installer/catalog.json;." installer/standrig_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: StandRigSetup
          path: dist/StandRigSetup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StandRigSetup.exe
